<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660"><rect width="100%" height="100%" fill="#fffdf7"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.wire{stroke:#21354a;stroke-width:3;fill:none}.note{font-size:22px}.small{font-size:18px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b42b38"/></marker></defs><text x="35" y="40" font-size="26">学生 A · 竖直圆周运动作业（合成）</text><circle cx="170" cy="175" r="88" fill="none" stroke="#9aa7b5" stroke-width="2"/><circle cx="170" cy="263" r="7" fill="#243851"/><line x1="170" y1="263" x2="170" y2="175" class="wire" /><text x="182" y="220" font-size="22">绳</text><line x1="155" y1="263" x2="155" y2="185" stroke="#b42b38" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="180" font-size="22">T</text><line x1="185" y1="263" x2="185" y2="325" stroke="#b42b38" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="320" font-size="22">mg</text><line x1="215" y1="263" x2="215" y2="185" stroke="#b42b38" stroke-width="3" marker-end="url(#arrow)"/><text x="224" y="183" font-size="19">F_c = mv²/r</text><text x="330" y="130" font-size="21">最低点实际受力：T、mg、F_c 三个力。</text><text x="35" y="375" font-size="21">① θ 从最低点沿运动方向计，径向向圆心为正。</text><text x="35" y="418" font-size="21">② ½mv² = ½m·6² − mgr(1 − cosθ)。</text><text x="35" y="461" font-size="21">③ 整理：v² = 20 + 16 cosθ。</text><text x="35" y="504" font-size="21">④ 径向方程：T − mg cosθ = mv²/r。</text><text x="35" y="547" font-size="21">⑤ 最高点 cosθ = −1，v² = 4，T = −2.5 N。</text><text x="35" y="590" font-size="21">⑥ 负张力表示绳向外推，所以小球能沿圆周越过最高点。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660"><rect width="100%" height="100%" fill="#fffdf7"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.wire{stroke:#21354a;stroke-width:3;fill:none}.note{font-size:22px}.small{font-size:18px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b42b38"/></marker></defs><text x="35" y="40" font-size="26">学生 B · 竖直圆周运动作业（合成）</text><circle cx="170" cy="175" r="88" fill="none" stroke="#9aa7b5" stroke-width="2"/><circle cx="170" cy="263" r="7" fill="#243851"/><line x1="170" y1="263" x2="170" y2="175" class="wire" /><text x="182" y="220" font-size="22">绳</text><line x1="155" y1="263" x2="155" y2="185" stroke="#b42b38" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="180" font-size="22">T</text><line x1="185" y1="263" x2="185" y2="325" stroke="#b42b38" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="320" font-size="22">mg</text><text x="330" y="130" font-size="21">最低点实际受力只有 T 与 mg。</text><text x="330" y="165" font-size="21">mv²/r 是合力的径向分量大小要求。</text><text x="35" y="375" font-size="21">① θ 从最低点沿运动方向计，径向向圆心为正。</text><text x="35" y="418" font-size="21">② 绳绷紧时：v² = 36 − 16(1 − cosθ)。</text><text x="35" y="461" font-size="21">③ T − mg cosθ = mv²/r，因此 T = 12.5 + 15 cosθ。</text><text x="35" y="504" font-size="21">④ T 首次到 0 时，cosθ = −5/6，v² = 20/3。</text><text x="35" y="547" font-size="21">⑤ θ ≈ 146.44°；绳在最高点之前失去张力。</text><text x="35" y="590" font-size="21">⑥ 此后小球先做抛体运动，不能继续用 r 不变的圆周模型。</text></svg>
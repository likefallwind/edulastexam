<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"><rect width="100%" height="100%" fill="#fffdf7"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.wire{stroke:#21354a;stroke-width:3;fill:none}.note{font-size:22px}.small{font-size:18px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b42b38"/></marker></defs><text x="32" y="40" font-size="25">活塞加热与冷却 · 教学图草稿</text><text x="45" y="83" font-size="23">初态</text><rect x="75" y="139" width="120" height="216" fill="#bedef4" stroke="#2e6b91"/><path d="M75,139 V355 H195 V139" class="wire"/><rect x="73" y="132" width="124" height="7" fill="#566c7f"/><path d="M60,168 H75 M195,168 H210" stroke="#b42b38" stroke-width="6"/><line x1="225" y1="355" x2="225" y2="139" class="wire" /><text x="232" y="247.0" font-size="16">h=12 cm</text><text x="45" y="395" font-size="20">T=300 K</text><text x="45" y="427" font-size="20">P=100 kPa</text><text x="45" y="459" font-size="20">V=240 cm³</text><text x="45" y="492" font-size="17">stop force=0 N ↓</text><text x="45" y="530" font-size="17">自由活塞</text><text x="325" y="83" font-size="23">首次触挡</text><rect x="355" y="175" width="120" height="180" fill="#bedef4" stroke="#2e6b91"/><path d="M355,139 V355 H475 V139" class="wire"/><rect x="353" y="168" width="124" height="7" fill="#566c7f"/><path d="M340,168 H355 M475,168 H490" stroke="#b42b38" stroke-width="6"/><line x1="505" y1="355" x2="505" y2="175" class="wire" /><text x="512" y="265.0" font-size="16">h=10 cm</text><text x="325" y="395" font-size="20">T=375 K</text><text x="325" y="427" font-size="20">P=100 kPa</text><text x="325" y="459" font-size="20">V=200 cm³</text><text x="325" y="492" font-size="17">stop force=0 N ↓</text><text x="325" y="530" font-size="17">刚触挡</text><text x="605" y="83" font-size="23">继续加热</text><rect x="635" y="139" width="120" height="216" fill="#bedef4" stroke="#2e6b91"/><path d="M635,139 V355 H755 V139" class="wire"/><rect x="633" y="132" width="124" height="7" fill="#566c7f"/><path d="M620,168 H635 M755,168 H770" stroke="#b42b38" stroke-width="6"/><line x1="785" y1="355" x2="785" y2="139" class="wire" /><text x="792" y="247.0" font-size="16">h=12 cm</text><text x="605" y="395" font-size="20">T=450 K</text><text x="605" y="427" font-size="20">P=100 kPa</text><text x="605" y="459" font-size="20">V=240 cm³</text><text x="605" y="492" font-size="17">stop force=0 N ↓</text><text x="605" y="530" font-size="17">继续等压</text><text x="885" y="83" font-size="23">冷却终态</text><rect x="915" y="175" width="120" height="180" fill="#bedef4" stroke="#2e6b91"/><path d="M915,139 V355 H1035 V139" class="wire"/><rect x="913" y="168" width="124" height="7" fill="#566c7f"/><path d="M900,168 H915 M1035,168 H1050" stroke="#b42b38" stroke-width="6"/><line x1="1065" y1="355" x2="1065" y2="175" class="wire" /><text x="1072" y="265.0" font-size="16">h=10 cm</text><text x="885" y="395" font-size="20">T=330 K</text><text x="885" y="427" font-size="20">P=88 kPa</text><text x="885" y="459" font-size="20">V=200 cm³</text><text x="885" y="492" font-size="17">stop force=0 N ↓</text><text x="885" y="530" font-size="17">一直被止挡锁住</text><text x="30" y="577" font-size="18">A = 20 cm²；缸内高 H = 12 cm；止挡位于气柱高度 h = 10 cm；示意图采用统一高度尺度。</text></svg>
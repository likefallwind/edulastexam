<svg xmlns="http://www.w3.org/2000/svg" width="820" height="690" viewBox="0 0 820 690"><rect width="100%" height="100%" fill="#fffdf7"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.wire{stroke:#21354a;stroke-width:3;fill:none}.note{font-size:22px}.small{font-size:18px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b42b38"/></marker></defs><text x="40" y="45" font-size="26">学生电路页 · 合成作业材料</text><line x1="310" y1="90" x2="120" y2="260" class="wire" /><rect x="185.0" y="165.0" width="60" height="20" fill="#fffdf7" stroke="#21354a" stroke-width="3" transform="rotate(138.17983011986425 215.0 175.0)"/><text x="145" y="155" font-size="22">3 Ω</text><line x1="120" y1="260" x2="310" y2="440" class="wire" /><rect x="185.0" y="340.0" width="60" height="20" fill="#fffdf7" stroke="#21354a" stroke-width="3" transform="rotate(43.45184230102203 215.0 350.0)"/><text x="145" y="390" font-size="22">6 Ω</text><line x1="310" y1="90" x2="500" y2="260" class="wire" /><rect x="375.0" y="165.0" width="60" height="20" fill="#fffdf7" stroke="#21354a" stroke-width="3" transform="rotate(41.82016988013577 405.0 175.0)"/><text x="430" y="155" font-size="22">6 Ω</text><line x1="500" y1="260" x2="310" y2="440" class="wire" /><rect x="375.0" y="340.0" width="60" height="20" fill="#fffdf7" stroke="#21354a" stroke-width="3" transform="rotate(136.54815769897797 405.0 350.0)"/><text x="430" y="390" font-size="22">3 Ω</text><line x1="120" y1="260" x2="500" y2="260" class="wire" /><rect x="280.0" y="250.0" width="60" height="20" fill="#fffdf7" stroke="#21354a" stroke-width="3" transform="rotate(0.0 310.0 260.0)"/><text x="290" y="242" font-size="22">6 Ω</text><circle cx="310" cy="90" r="6" fill="#21354a"/><text x="320" y="78" font-size="22">A</text><circle cx="120" cy="260" r="6" fill="#21354a"/><text x="130" y="248" font-size="22">C</text><circle cx="500" cy="260" r="6" fill="#21354a"/><text x="510" y="248" font-size="22">D</text><circle cx="310" cy="440" r="6" fill="#21354a"/><text x="320" y="428" font-size="22">B</text><line x1="395" y1="300" x2="220" y2="300" stroke="#b42b38" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="333" font-size="25">i₀</text><text x="40" y="495" font-size="22">① 设 B 为零电势：U_A = 12 V。</text><text x="40" y="533" font-size="22">② (12 − U_C)/3 = U_C/6 + (U_C − U_D)/6</text><text x="40" y="571" font-size="22">③ (12 − U_D)/6 + (U_C − U_D)/6 = U_D/3</text><text x="40" y="609" font-size="22">④ 联立得 U_C = 7.2 V，U_D = 4.8 V。</text><text x="40" y="647" font-size="22">⑤ 因而图中 i₀ = −0.40 A。</text></svg>